[project]
name = "socagent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [".venv", ".ruff_cache"]

[tool.ruff.lint]
# Explicit rule selection so the lint baseline only changes when this list
# does -- not when a new ruff release reshuffles its defaults.
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes: unused/undefined names
    "W",               # pycodestyle warnings
    "I",               # import sorting
    "B",               # flake8-bugbear
    "UP",              # pyupgrade
    "SIM",             # flake8-simplify
    "RUF",             # ruff-specific
    "PLW1510",         # subprocess.run without explicit check=
]
